<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wendy - 로그인</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, "Malgun Gothic", sans-serif;
        }
        
        body {
            background: #F5F5F7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 28px 24px;
            max-width: 400px;
            width: 100%;
            margin: 16px;
        }
        
        .title-area {
            text-align: center;
            margin-bottom: 26px;
        }
        
        .title-area h1 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        
        .title-area p {
            font-size: 12px;
            color: #8A8A8E;
        }
        
        .field {
            border: 1px solid #E5E5E7;
            border-radius: 8px;
            padding: 11px 12px;
            margin-bottom: 12px;
        }
        
        .field input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 13px;
            background: transparent;
        }
        
        .error-msg {
            color: #D85A30;
            font-size: 12px;
            margin: -4px 0 12px 2px;
            min-height: 14px;
        }
        
        .submit-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: #3348FF;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            margin-bottom: 14px;
        }
        
        .submit-btn:disabled {
            background: #B7BEFF;
            cursor: not-allowed;
        }
        
        .switch-text {
            text-align: center;
            font-size: 12px;
            color: #8A8A8E;
        }
        
        .switch-text span {
            color: #3348FF;
            font-weight: 500;
            cursor: pointer;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="card">

        <!-- 로그인 폼 -->
        <div id="login-form">
            <div class="title-area">
                <h1>다시 만나서 반가워</h1>
                <p>아이디와 비밀번호로 로그인해줘</p>
            </div>

            <div class="field">
                <input type="text" id="login-username" placeholder="아이디" />
            </div>
            <div class="field">
                <input type="password" id="login-password" placeholder="비밀번호" />
            </div>
            <div class="error-msg" id="login-error"></div>

            <button class="submit-btn" id="login-btn">로그인</button>
            <div class="switch-text">
                계정이 없으신가요? <span id="go-signup">회원가입</span>
            </div>
        </div>

        <!-- 회원가입 폼 -->
        <div id="signup-form" class="hidden">
            <div class="title-area">
                <h1>환영해, 시작해볼까?</h1>
                <p>아이디와 비밀번호만 있으면 바로 시작할 수 있어</p>
            </div>

            <div class="field">
                <input type="text" id="signup-username" placeholder="아이디" />
            </div>
            <div class="field">
                <input type="password" id="signup-password" placeholder="비밀번호" />
            </div>
            <div class="field">
                <input type="password" id="signup-password-confirm" placeholder="비밀번호 확인" />
            </div>
            <div class="error-msg" id="signup-error"></div>

            <button class="submit-btn" id="signup-btn">회원가입</button>
            <div class="switch-text">
                이미 계정이 있으신가요? <span id="go-login">로그인</span>
            </div>
        </div>

    </div>
    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'; 
        const supabase = createClient( 'https://dmkvbvzukqtfiwyyphtl.supabase.co', 'sb_publishable_nFz7j6nrEGchxMVp-CBh1Q_XuQsKpw4' ); 
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form'); // 로그인 <-> 회원가입 화면 전환 
        document.getElementById('go-signup').addEventListener('click', () => { loginForm.classList.add('hidden'); signupForm.classList.remove('hidden'); }); 
        document.getElementById('go-login').addEventListener('click', () => { signupForm.classList.add('hidden');
        loginForm.classList.remove('hidden'); }); // 아이디를 Supabase Auth가 요구하는 이메일 형식으로 변환 
        function toFakeEmail(username) { return `${username}@wendy.local`; } 
        // ---- 로그인 ---- 
        document.getElementById('login-btn').addEventListener('click', async () => { 
            const username = document.getElementById('login-username').value.trim(); 
            const password = document.getElementById('login-password').value; 
            const errorEl = document.getElementById('login-error'); errorEl.textContent = ''; 
            if (!username || !password) { errorEl.textContent = '아이디와 비밀번호를 모두 입력해줘'; return; } 
            const { data, error } = await supabase.auth.signInWithPassword({ email: toFakeEmail(username), password, }); 
            if (error) { 
              errorEl.textContent = '아이디 또는 비밀번호가 올바르지 않아'; 
              return;
            } // 로그인 성공 → 메인 캘린더 화면으로 이동 
            window.location.href = 'calendar.html'; }); // ---- 회원가입 ---- 
            document.getElementById('signup-btn').addEventListener('click', async () => { 
              const username = document.getElementById('signup-username').value.trim();
              const password = document.getElementById('signup-password').value; 
              const passwordConfirm = document.getElementById('signup-password-confirm').value; 
              const errorEl = document.getElementById('signup-error'); errorEl.textContent = ''; 
              if (!username || !password || !passwordConfirm) { 
                errorEl.textContent = '모든 항목을 입력해줘'; 
                return; 
              } 
              if (password !== passwordConfirm) {
                 errorEl.textContent = '비밀번호가 서로 달라'; 
                 return; 
              } 
              if (password.length < 6) { 
                errorEl.textContent='비밀번호는 6자 이상이어야 해' ; 
                return; 
              }
              const { data, error }= await supabase.auth.signUp({ email: toFakeEmail(username), password, }); 
              if (error) { errorEl.textContent='이미 사용 중인 아이디이거나 오류가 발생했어' ; 
               return; 
               
              } // 가입 성공 → 온보딩(이름/학교/그룹 설정) 화면으로 이동 
              window.location.href='onboarding.html' ; }); 
    </script>

</body>

</html>
